services:
  - type: web
    name: humanstamp-web
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: storage
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: humanstamp-db
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        value: ${RENDER_EXTERNAL_URL}
      - key: NEXT_PUBLIC_BASE_URL
        value: ${RENDER_EXTERNAL_URL}
      - key: JWT_SECRET
        generateValue: true
      - key: SIGNING_PRIVATE_KEY
        sync: false
        # REQUIRED in production: Ed25519 private key for receipt signing
        # Generate with: node -e "const sodium = require('libsodium-wrappers'); (async () => { await sodium.ready; const k = sodium.crypto_sign_keypair(); console.log('Private:', Buffer.from(k.privateKey).toString('base64')); console.log('Public:', Buffer.from(k.publicKey).toString('base64')); })()"
        # Without this, receipts become invalid after deployment
      - key: SIGNING_PUBLIC_KEY
        sync: false
        # REQUIRED in production: Ed25519 public key matching SIGNING_PRIVATE_KEY
      - key: RUN_WORKER_IN_PROCESS
        value: true
      - key: DEMO_LOGIN
        value: true
      - key: STORAGE_TYPE
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /data/storage
      - key: NODE_ENV
        value: production

databases:
  - name: humanstamp-db
    databaseName: humanstamp
    plan: basic-256mb
    region: frankfurt
